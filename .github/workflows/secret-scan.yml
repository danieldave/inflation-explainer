# Blocks a push that contains a real-looking API key, token or private key. No third-party actions.
name: secret scan
on:
  push:
  pull_request:
permissions: { contents: read }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node scripts/secret-scan.mjs
      - run: node --test scripts/secret-scan.test.mjs
